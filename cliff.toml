# git-cliff configuration, see https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n"
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{% endfor %}
{%- endfor -%}
{% if previous.version %}
**Full changelog**: https://github.com/CHE3MZ/caffeine/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "CI" },
    { field = "author.name", pattern = "dependabot|github-actions", skip = true },
    { message = "^chore\\(deps\\)|^chore\\(release\\)", skip = true },
    { message = "^Merge", skip = true },
    { message = "^chore", group = "Maintenance" },
    { message = ".*", group = "Other" },
]
